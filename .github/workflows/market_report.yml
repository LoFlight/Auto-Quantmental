name: Daily Quantamental Engine

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 내 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy jinja2 lxml pyarrow google-generativeai

- name: 4. AI 퀀트멘털 엔진 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python nasdaq100_guide_v9.0_Github.py

    - name: 5. 새로 생성된 데이터 및 리포트를 GitHub에 덮어쓰기 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "📊 Daily Market Data Auto-Update"
        git push
